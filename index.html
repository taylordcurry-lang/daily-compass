<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Compass</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f8f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1719" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compass">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a cozy planner page in oat, blush and plum. Today shows one part of the day at a time,
   with the next unchecked habit called out so there's always one obvious thing to do. */
:root {
  --bg: #f8f2ee; --surface: #fffdfb; --surface-2: #f5ece7; --line: #ecdfd8; --glow: #f7d9df;
  --ink: #3b2f30; --muted: #7d6a65; --accent: #b94d6d; --accent-ink: #ffffff; --accent-soft: #f9e1e7;
  --am: #fbe6e4; --am-strong: #b44a62; --any: #f1e8dc; --any-strong: #86623d; --pm: #efe4ec; --pm-strong: #8c5a7e;
  --shadow: 0 1px 2px rgb(90 40 50 / .05), 0 6px 18px rgb(140 70 90 / .08);
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1719; --surface: #282022; --surface-2: #31282a; --line: #44383a; --glow: #3a2329;
  --ink: #f6ebe7; --muted: #b8a6a1; --accent: #f2a7b9; --accent-ink: #2a1a1f; --accent-soft: #3d2930;
  --am: #3b262b; --am-strong: #f4a9b6; --any: #352c24; --any-strong: #dcb78e; --pm: #33252f; --pm-strong: #dba8cc;
  --shadow: 0 1px 2px rgb(0 0 0 / .35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1d1719; --surface: #282022; --surface-2: #31282a; --line: #44383a; --glow: #3a2329;
  --ink: #f6ebe7; --muted: #b8a6a1; --accent: #f2a7b9; --accent-ink: #2a1a1f; --accent-soft: #3d2930;
  --am: #3b262b; --am-strong: #f4a9b6; --any: #352c24; --any-strong: #dcb78e; --pm: #33252f; --pm-strong: #dba8cc;
  --shadow: 0 1px 2px rgb(0 0 0 / .35); color-scheme: dark }

[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; margin: 0;
  background-image: radial-gradient(900px 420px at 90% -8%, var(--glow), transparent 65%), radial-gradient(600px 320px at -10% 4%, color-mix(in srgb, var(--glow) 55%, transparent), transparent 70%);
  background-repeat: no-repeat; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 48px; display: grid; gap: 18px; }
h1, h2 { font-family: var(--display); font-variation-settings: "SOFT" 100; margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: 2.2rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
h1 .mark { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
h1 .mark svg { width: 20px; height: 20px; }
h2 { font-size: 1.45rem; }
h3 { margin: 0; font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sub, .note { color: var(--muted); }
.note { font-size: .88rem; }
.empty { color: var(--muted); font-style: italic; margin: 0; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; }
.daynav { display: flex; align-items: center; gap: 6px; }
.daynav b { font-weight: 800; }
.iconbtn { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; font-size: 1.2rem; line-height: 1; color: var(--accent); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 800; padding: 4px 2px; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface-2) 88%, transparent); backdrop-filter: blur(10px); border-radius: 999px; padding: 5px; display: flex; gap: 4px; }
.tabs button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 9px 8px; font-weight: 800; color: var(--muted); transition: background .2s, color .2s; }
.tabs button[aria-selected="true"] { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); color: var(--accent); box-shadow: var(--shadow); }

/* Part-of-day switcher */
.segs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.seg { border: 2px solid transparent; background: var(--surface); box-shadow: var(--shadow); border-radius: 20px; padding: 12px 8px; display: grid; justify-items: center; gap: 2px; font-weight: 800; transition: background .2s, border-color .2s; }
.seg svg { width: 24px; height: 24px; }
.seg small { font-weight: 600; color: var(--muted); font-size: .8rem; }
.seg.am { --tint: var(--am); --strong: var(--am-strong); }
.seg.any { --tint: var(--any); --strong: var(--any-strong); }
.seg.pm { --tint: var(--pm); --strong: var(--pm-strong); }
.seg svg { color: var(--strong); }
.seg[aria-pressed="true"] { background: var(--tint); border-color: var(--strong); }
.seg.complete small { color: var(--strong); }

/* The panel for the chosen part of the day */
.panel { border-radius: 28px; padding: 22px 18px; display: grid; gap: 16px; background: linear-gradient(165deg, var(--tint), color-mix(in srgb, var(--tint) 45%, var(--bg))); position: relative; overflow: hidden; }
.panel > .deco { position: absolute; right: -26px; top: -26px; width: 130px; height: 130px; color: var(--strong); opacity: .1; pointer-events: none; }
.panel > .deco svg { width: 100%; height: 100%; }
.panel-head .pct { font-family: var(--display); font-size: 2.4rem; line-height: 1; font-weight: 600; color: var(--strong); }
.panel-head .pct small { font-size: 1rem; }
.panel.alldone .sub { color: var(--strong); font-weight: 800; }
.panel.am { --tint: var(--am); --strong: var(--am-strong); }
.panel.any { --tint: var(--any); --strong: var(--any-strong); }
.panel.pm { --tint: var(--pm); --strong: var(--pm-strong); }
.panel-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.meter { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--strong) 16%, transparent); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--strong) 70%, var(--accent-soft)), var(--strong)); border-radius: 99px; transition: width .4s cubic-bezier(.3, 1.4, .5, 1); }

.hlist { display: grid; gap: 10px; }
.hrow { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 18px; padding: 15px 16px; min-height: 62px; box-shadow: var(--shadow); transition: transform .12s, background .2s; }
.hrow:active { transform: scale(.98); }
.hrow .check { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2.5px solid color-mix(in srgb, var(--strong) 55%, transparent); display: grid; place-items: center; color: var(--surface); font-size: 15px; font-weight: 800; }
.hrow[aria-pressed="true"] { background: color-mix(in srgb, var(--surface) 70%, transparent); box-shadow: none; }
.hrow[aria-pressed="true"] .check { background: var(--strong); border-color: var(--strong); }
.hrow.pop .check { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.5); } 100% { transform: scale(1); } }
.hrow[aria-pressed="true"] .hname { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.hrow .hname { flex: 1; min-width: 0; font-weight: 700; display: grid; }
.hrow .hname small { font-weight: 600; color: var(--strong); font-size: .8rem; text-decoration: none; }
.hrow .streak { font-size: .78rem; color: var(--strong); background: color-mix(in srgb, var(--strong) 12%, transparent); border-radius: 99px; padding: 2px 9px; font-weight: 800; white-space: nowrap; }
/* The first unchecked habit: one obvious next step. */
.hrow.next { box-shadow: 0 0 0 2.5px var(--strong), var(--shadow); }
.hrow.next .check { border-color: var(--strong); }
.upnext { font-size: .7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--strong); }

.hcard { display: grid; gap: 0; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.hcard .hrow { box-shadow: none; }
.hcard:has(.hrow.next) { box-shadow: 0 0 0 2.5px var(--strong), var(--shadow); }
.hcard:has(.hrow[aria-pressed="true"]) { background: color-mix(in srgb, var(--surface) 70%, transparent); box-shadow: none; }
.hcard .hrow[aria-pressed="true"] { background: none; }
.hline { display: flex; align-items: stretch; }
.hline .hrow { flex: 1; min-width: 0; }
.chev { border: 0; border-left: 1px solid var(--line); background: none; color: var(--strong); font-weight: 800; padding: 0 14px; border-radius: 0 18px 18px 0; white-space: nowrap; }
.plist { border-top: 1px solid var(--line); padding: 10px 16px 14px; display: grid; gap: 6px; }
.ptitle { font-weight: 800; }
.plist ol { margin: 0; padding-left: 24px; display: grid; gap: 2px; }
.plist li::marker { color: var(--strong); font-weight: 800; }
.pstep { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
.pstep input { width: 20px; height: 20px; flex: none; accent-color: var(--strong); }
.pstep input:checked + span { color: var(--muted); text-decoration: line-through; }
.metric .meter { margin-top: 4px; }
.applink { color: var(--strong); font-weight: 800; text-decoration: none; }
.applink:hover { text-decoration: underline; }
.routine { background: var(--surface); border-radius: 14px; padding: 12px 16px; }
.routine summary { cursor: pointer; font-weight: 800; }
.routine summary .note { font-weight: 600; }
.routine ol { margin: 10px 0 8px; padding-left: 24px; display: grid; gap: 4px; }
.routine li::marker { color: var(--strong); font-weight: 800; }
.routine p { margin: 10px 0; }
.rstep { display: flex; align-items: center; gap: 6px; }
.rstep span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rstep .linkbtn { color: var(--muted); font-size: .9rem; }

.log { background: var(--surface); border-radius: 20px; padding: 16px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.scale-row { display: grid; gap: 6px; }
.scale-row .lbl { display: flex; justify-content: space-between; font-weight: 800; gap: 8px; }
.scale-row .lbl span { color: var(--muted); font-weight: 600; font-size: .85rem; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { border: 1.5px solid transparent; background: var(--surface-2); border-radius: 14px; min-height: 46px; font-weight: 800; transition: background .15s, transform .12s; }
.scale button:active { transform: scale(.94); }
.scale button[aria-pressed="true"] { background: var(--strong); color: var(--surface); border-color: var(--strong); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.metric { display: grid; gap: 4px; }
.metric label { font-size: .85rem; color: var(--muted); font-weight: 800; }
.field { width: 100%; box-sizing: border-box; border: 1.5px solid transparent; background: var(--surface-2); border-radius: 14px; padding: 11px 13px; }
.field:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.addrow .field { flex: 1; min-width: 140px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 10px 18px; font-weight: 800; white-space: nowrap; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); border: 0; }
.btn:disabled { opacity: .55; cursor: default; }
.danger { color: #c0392b !important; }
.editor { background: var(--surface); border-radius: 20px; padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.edit-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

/* Cards on Trends and Week */
.card { background: var(--surface); border-radius: 26px; padding: 20px 18px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid transparent; background: var(--surface-2); border-radius: 99px; padding: 6px 14px; font-weight: 800; font-size: .88rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--body); font-size: 12px; font-weight: 700; }
.scroll-x { overflow-x: auto; }
.heat { border-collapse: separate; border-spacing: 3px; font-size: .82rem; }
.heat th { text-align: left; font-weight: 700; padding-right: 10px; white-space: nowrap; }
.heat td { width: 15px; height: 15px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); padding: 0; }
.heat tr.am td.on { background: var(--am-strong); border-color: var(--am-strong); }
.heat tr.any td.on { background: var(--any-strong); border-color: var(--any-strong); }
.heat tr.pm td.on { background: var(--pm-strong); border-color: var(--pm-strong); }
.heat td.today { outline: 2px solid var(--ink); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { --strong: var(--am-strong); background: var(--am); border-radius: 18px; padding: 14px; display: grid; gap: 2px; }
.stat:nth-child(3n+2) { --strong: var(--any-strong); background: var(--any); }
.stat:nth-child(3n) { --strong: var(--pm-strong); background: var(--pm); }
.stat b { font-family: var(--display); font-size: 1.8rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--strong); }
.stat span { font-size: .82rem; color: var(--muted); font-weight: 700; }
.weekrows { display: grid; }
.weekrow { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding-block: 10px; border-top: 1px solid var(--line); align-items: center; }
.weekrow:first-child { border-top: 0; }
.weekrow .d { font-weight: 800; color: var(--muted); font-size: .9rem; }
.pill { display: inline-block; font-size: .78rem; font-weight: 800; border-radius: 99px; padding: 2px 9px; margin: 2px 4px 2px 0; background: var(--surface-2); }
.pill.am { background: var(--am); color: var(--am-strong); }
.pill.any { background: var(--any); color: var(--any-strong); }
.pill.pm { background: var(--pm); color: var(--pm-strong); }
.coach-btns { display: flex; gap: 8px; flex-wrap: wrap; }
label.btn { cursor: pointer; display: inline-block; }
footer { font-size: .82rem; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="sub" id="greeting">Hello</div>
      <h1><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg></span>Daily Compass</h1>
    </div>
    <div class="daynav" id="daynav">
      <button class="iconbtn" id="prevDay" aria-label="Previous day">&lsaquo;</button>
      <div><b id="dayLabel">Today</b> <span class="sub num" id="dayDate"></span></div>
      <button class="iconbtn" id="nextDay" aria-label="Next day">&rsaquo;</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="trends" aria-selected="false">Trends</button>
    <button role="tab" data-tab="week" aria-selected="false">My week</button>
  </nav>

  <!-- TODAY -->
  <section id="tab-today" style="display:grid;gap:14px">
    <div class="segs" id="segs"></div>
    <div id="panel"></div>
  </section>

  <!-- TRENDS -->
  <section id="tab-trends" hidden style="display:grid;gap:16px">
    <div class="card">
      <div class="card-head"><h2>Last 30 days</h2><span class="note num" id="trendSummary"></span></div>
      <div class="chips" id="metricChips"></div>
      <div id="chartBox"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Habit grid</h2><span class="note">last 28 days</span></div>
      <div class="scroll-x" id="heatBox"></div>
    </div>
  </section>

  <!-- WEEK -->
  <section id="tab-week" hidden style="display:grid;gap:16px">
    <div class="card">
      <div class="card-head"><h2>Your last 7 days</h2><span class="note num" id="weekRange"></span></div>
      <div class="stats" id="weekStats"></div>
    </div>
    <div class="card">
      <h2>Day by day</h2>
      <div class="weekrows" id="weekRows"></div>
    </div>
    <div class="card">
      <h2>Backup</h2>
      <div class="note">Your check-ins live only on this phone. Save a backup now and then, and use it to move everything to a new phone.</div>
      <div class="coach-btns">
        <button class="btn" id="exportBtn">Save a backup</button>
        <label class="btn ghost" for="importFile" tabindex="0">Restore a backup</label>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="note" id="backupNote" role="status"></div>
    </div>
  </section>

  <footer id="saveNote">Loading…</footer>
</div>

<script>
(() => {
  // ---------- helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const shift = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const todayKey = () => keyOf(new Date());
  const lastN = (n, end = todayKey()) => Array.from({ length: n }, (_, i) => shift(end, i - n + 1));
  const fmt = (k, o) => fromKey(k).toLocaleDateString(undefined, o);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  const isNum = v => typeof v === "number" && isFinite(v);

  const CONFIG_VERSION = 4;
  const STEP_GOAL = 10000;
  const AM_SKIN = [
    "BYOMA Jelly Cleanser",
    "NuFACE conductive gel, applied in a thick layer",
    "NuFACE, about 5 min",
    "Pat in the leftover gel, or rinse it off",
    "Thayers Toner",
    "Caudalie Vinoperfect",
    "Azelaic Acid",
    "Good Molecules Eye Gel",
    "epii Double Up Cream",
    "SPF",
    "Effaclar Duo on pimples, if needed"
  ];
  // Evening routine changes by weekday (0 = Sunday).
  const PM_SKIN = [
    { id: "tret", label: "Tret night", days: [1, 4], steps: ["Haruharu Oil", "BYOMA Jelly Cleanser", "Let your skin dry fully", "Tretinoin, pea-size amount", "epii Double Up Cream", "KOEC Eye Cream"] },
    { id: "exfoliate", label: "Exfoliate night", days: [6], steps: ["Haruharu Oil", "BYOMA Jelly Cleanser", "Medicube Pad or PanOxyl", "Optional: a mask before the HPT6", "epii HPT6", "epii Double Up Cream"] },
    { id: "recovery", label: "Recovery night", days: [0, 2, 3, 5], steps: ["Haruharu Oil", "BYOMA Jelly Cleanser", "Thayers Toner", "BYOMA Phyto-Mucin Serum", "epii HPT6", "epii Double Up Cream", "Cicaplast, if dry"] }
  ];
  const ICONS = {
    am: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>`,
    any: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20c4-1 6-4 7-8 1 4 3 7 9 8"/><circle cx="12" cy="6" r="3"/></svg>`,
    pm: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`
  };
  const SLOTS = [["am", "Morning"], ["any", "Daytime"], ["pm", "Evening"]];
  const SLOT_LABEL = Object.fromEntries(SLOTS);
  const DEFAULT_CONFIG = {
    v: CONFIG_VERSION,
    habits: [
      { id: "am-redlight", name: "Red light + vibe plate 10 min", slot: "am" },
      { id: "am-workout", name: "Workout", slot: "am", fitness: true },
      { id: "leo", name: "Walk Leo", slot: "am" },
      { id: "am-skin", name: "Skincare", slot: "am", steps: AM_SKIN.slice() },
      { id: "pm-workout", name: "Workout", slot: "pm", fitness: true },
      { id: "pm-leo", name: "Walk Leo", slot: "pm" },
      { id: "steps", name: "10k steps by bedtime", slot: "pm" },
      { id: "pm-redlight", name: "Red light + vibe plate 10 min", slot: "pm" },
      { id: "read", name: "Read 10 pages", slot: "pm" },
      { id: "pm-skin", name: "Skincare", slot: "pm", variants: structuredClone(PM_SKIN) },
      { id: "pm-meds", name: "Take meds", slot: "pm" }
    ],
    fitness: { name: "Pilates Project", url: "https://apps.apple.com/us/app/-/id1590468659" }
  };
  // Quick numbers logged in each part of the day.
  const SLOT_LOG = { am: ["sleep", "weight"], any: [], pm: ["steps", "mood", "energy", "workout"] };
  const slotOf = h => h.slot || "any";
  const variantOf = (h, k) => h.variants?.find(v => v.days.includes(fromKey(k).getDay())) || null;
  const stepsOf = (h, k) => h.variants ? (variantOf(h, k)?.steps || []) : h.steps;
  const hasRoutine = h => Array.isArray(h.steps) || Array.isArray(h.variants);
  const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const hname = h => (h.slot === "am" ? "AM " : h.slot === "pm" ? "PM " : "") + h.name;
  const emptyDay = () => ({ habits: {}, products: {}, mood: null, energy: null, sleep: null, workout: null, weight: null, steps: null });

  // ---------- storage: this device only (localStorage), with backup files for moving it ----------
  const store = {
    local(k, v) {
      try {
        if (v === undefined) return JSON.parse(localStorage.getItem("dc:" + k) || "null");
        localStorage.setItem("dc:" + k, JSON.stringify(v));
        return true;
      } catch { return false; }
    },
    load() {
      const days = {};
      Object.entries(this.local("days") || {}).forEach(([k, d]) => { days[k] = { ...emptyDay(), ...d }; });
      return { config: this.local("config") || structuredClone(DEFAULT_CONFIG), days };
    },
    saveConfig(cfg) { setSaved(this.local("config", cfg)); },
    saveDay() { setSaved(this.local("days", state.days)); }
  };

  const state = { config: structuredClone(DEFAULT_CONFIG), days: {}, cur: todayKey(), tab: "today", slot: null, metric: "sleep", editing: false, openRoutines: new Set() };
  const day = k => state.days[k] || emptyDay();
  const touchDay = k => { if (!state.days[k]) state.days[k] = emptyDay(); return state.days[k]; };
  const commitDay = k => { state.days[k].updated = Date.now(); store.saveDay(); };

  function setSaved(ok) {
    $("#saveNote").textContent = ok ? "Saved on this phone · works offline" : "Couldn't save. Your phone may be out of space or in private browsing.";
  }

  // ---------- backup ----------
  function exportBackup() {
    const blob = new Blob([JSON.stringify({ app: "daily-compass", v: 1, exported: new Date().toISOString(), config: state.config, days: state.days }, null, 1)], { type: "application/json" });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `daily-compass-backup-${todayKey()}.json` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $("#backupNote").textContent = "Backup saved. Keep it somewhere safe, like Files or Google Drive.";
  }
  async function importBackup(file) {
    try {
      const data = JSON.parse(await file.text());
      if (data?.app !== "daily-compass" || !data.config || typeof data.days !== "object") throw new Error();
      const n = Object.keys(data.days).length;
      if (!confirm(`Restore ${n} day${n === 1 ? "" : "s"} from this backup? It replaces what's on this phone now.`)) return;
      state.config = data.config; state.days = {};
      Object.entries(data.days).forEach(([k, d]) => { state.days[k] = { ...emptyDay(), ...d }; });
      store.saveConfig(state.config); store.saveDay();
      $("#backupNote").textContent = `Restored ${n} day${n === 1 ? "" : "s"}.`;
      renderWeek();
    } catch { $("#backupNote").textContent = "That file isn't a Daily Compass backup."; }
  }

  function streak(habitId) {
    let k = todayKey(), n = 0;
    if (!day(k).habits[habitId]) k = shift(k, -1); // today not done yet doesn't break the streak
    while (day(k).habits[habitId]) { n++; k = shift(k, -1); }
    return n;
  }
  const slotHabits = s => state.config.habits.filter(h => slotOf(h) === s);
  // Only parts of the day that have habits get a tab; Daytime disappears when it's empty.
  const activeSlots = () => SLOTS.filter(([s]) => slotHabits(s).length);
  function slotNow() {
    const hr = new Date().getHours(), have = activeSlots().map(([s]) => s);
    const want = have.includes("any") ? (hr < 12 ? "am" : hr < 17 ? "any" : "pm") : (hr < 14 ? "am" : "pm");
    return have.includes(want) ? want : have[0] || "am";
  }
  const productsDone = (h, d) => d.products?.[h.id] || [];
  const slotDone = (s, k) => slotHabits(s).filter(h => day(k).habits[h.id]).length;

  // ---------- TODAY ----------
  function renderDayNav() {
    const t = todayKey();
    $("#dayLabel").textContent = state.cur === t ? "Today" : state.cur === shift(t, -1) ? "Yesterday" : fmt(state.cur, { weekday: "long" });
    $("#dayDate").textContent = fmt(state.cur, { month: "short", day: "numeric" });
    $("#nextDay").disabled = state.cur >= t;
    $("#daynav").hidden = state.tab !== "today";
  }

  function renderSegs() {
    const slots = activeSlots();
    if (!slots.some(([s]) => s === state.slot)) state.slot = slotNow();
    $("#segs").style.gridTemplateColumns = `repeat(${slots.length || 1}, 1fr)`;
    $("#segs").innerHTML = slots.map(([s, label]) => {
      const n = slotHabits(s).length, d = slotDone(s, state.cur), all = n && d === n;
      return `<button class="seg ${s} ${all ? "complete" : ""}" data-seg="${s}" aria-pressed="${state.slot === s}">${ICONS[s]}${label}<small class="num">${all ? "done ✓" : `${d} of ${n}`}</small></button>`;
    }).join("");
  }

  function habitRow(h, d, next) {
    const on = !!d.habits[h.id], s = streak(h.id), v = variantOf(h, state.cur);
    const extra = h.id === "steps" && isNum(d.steps) ? `<small class="num">${d.steps.toLocaleString()} of ${STEP_GOAL.toLocaleString()}</small>` : v ? `<small>${esc(v.label)}</small>` : "";
    const cls = ["hrow", next ? "next" : "", on && state.pop === h.id ? "pop" : ""].filter(Boolean).join(" ");
    const row = `<button class="${cls}" data-habit="${esc(h.id)}" aria-pressed="${on}"><span class="check">${on ? "✓" : ""}</span><span class="hname">${next ? `<span class="upnext">Up next</span>` : ""}${esc(h.name)}${extra}</span>${s > 1 ? `<span class="streak">${s} day streak</span>` : ""}</button>`;
    if (!hasRoutine(h)) return row;
    const open = state.openRoutines.has(h.id), steps = stepsOf(h, state.cur), done = productsDone(h, d).filter(p => steps.includes(p)).length;
    return `<div class="hcard"><div class="hline">${row}<button class="chev" data-expand="${esc(h.id)}" aria-expanded="${open}" aria-label="${open ? "Hide" : "Show"} products"><span class="num">${done}/${steps.length}</span> ${open ? "▴" : "▾"}</button></div>${open ? productList(h, d) : ""}</div>`;
  }

  // The day's products as a checklist; ticking the last one checks off the habit.
  function productList(h, d) {
    const steps = stepsOf(h, state.cur), v = variantOf(h, state.cur), done = productsDone(h, d);
    const title = v ? `${state.cur === todayKey() ? "Tonight" : fmt(state.cur, { weekday: "long" })}: ${esc(v.label)} <span class="note">(${v.days.map(x => DAY_NAMES[x]).join(", ")})</span>` : "";
    return `<div class="plist">
      ${title ? `<div class="ptitle">${title}</div>` : ""}
      ${steps.length ? `<ol>${steps.map((s, i) => `<li><div class="rstep"><label class="pstep"><input type="checkbox" data-prod="${esc(h.id)}:${i}" ${done.includes(s) ? "checked" : ""}><span>${esc(s)}</span></label>${state.editing ? `${i ? `<button class="linkbtn" data-rstep-up="${esc(h.id)}:${i}" aria-label="Move ${esc(s)} earlier">↑</button>` : ""}<button class="linkbtn danger" data-rstep-del="${esc(h.id)}:${i}" aria-label="Remove ${esc(s)}">✕</button>` : ""}</div></li>`).join("")}</ol>` : `<p class="empty">Tap Edit to add your products in the order you use them.</p>`}
      ${state.editing ? `<form class="addrow" data-add-rstep="${esc(h.id)}"><input class="field" id="rstep-${esc(h.id)}" placeholder="Next product" maxlength="60"><button class="btn ghost" type="submit">Add</button></form>` : ""}
    </div>`;
  }

  function logBlock(slot) {
    const d = day(state.cur), fields = SLOT_LOG[slot];
    if (!fields.length) return "";
    const scale = (f, label, hint) => `<div class="scale-row"><div class="lbl">${label} <span>${hint}</span></div><div class="scale">${[1, 2, 3, 4, 5].map(n => `<button data-scale="${f}" data-val="${n}" aria-pressed="${d[f] === n}" aria-label="${label} ${n}">${n}</button>`).join("")}</div></div>`;
    const num = (f, label, ph, step) => `<div class="metric"><label for="m-${f}">${label}</label><input class="field num" id="m-${f}" data-metric="${f}" type="number" inputmode="decimal" min="0" step="${step}" placeholder="${ph}" value="${isNum(d[f]) ? d[f] : ""}"></div>`;
    const parts = [];
    if (fields.includes("mood")) parts.push(scale("mood", "Mood", "1 rough · 5 great"));
    if (fields.includes("energy")) parts.push(scale("energy", "Energy", "1 drained · 5 charged"));
    if (fields.includes("steps")) {
      const pct = isNum(d.steps) ? Math.min(100, Math.round(d.steps / STEP_GOAL * 100)) : 0;
      parts.push(`<div class="metric"><label for="m-steps">Steps today <span class="note">(from your Oura app)</span></label><input class="field num" id="m-steps" data-metric="steps" type="number" inputmode="numeric" min="0" step="100" placeholder="e.g. 8400" value="${isNum(d.steps) ? d.steps : ""}"><div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div></div>`);
    }
    const nums = [];
    if (fields.includes("sleep")) nums.push(num("sleep", "Hours slept", "7.5", "0.5"));
    if (fields.includes("weight")) nums.push(num("weight", "Weight (optional)", "–", "0.1"));
    if (fields.includes("workout")) nums.push(num("workout", "Workout minutes", "30", "5"));
    if (nums.length) parts.push(`<div class="metrics">${nums.join("")}</div>`);
    return `<div class="log"><h3>${slot === "am" ? "Morning log" : "Evening log"}</h3>${parts.join("")}</div>`;
  }

  function renderPanel() {
    const s = state.slot, d = day(state.cur), list = slotHabits(s), done = slotDone(s, state.cur), fit = state.config.fitness || {};
    const pct = list.length ? Math.round(done / list.length * 100) : 0;
    const all = list.length && done === list.length, nextId = list.find(h => !d.habits[h.id])?.id;
    const msg = !list.length ? "Nothing here yet." : all ? "All done. Go you ✿" : `${done} of ${list.length} done`;
    $("#panel").innerHTML = `<section class="panel ${s} ${all ? "alldone" : ""}">
      <span class="deco">${ICONS[s]}</span>
      <div class="panel-head"><div><h2>${SLOT_LABEL[s]}</h2><div class="sub num">${msg}</div><button class="linkbtn" id="editBtn">${state.editing ? "Done editing" : "Edit"}</button></div>${list.length ? `<div class="pct num">${pct}<small>%</small></div>` : ""}</div>
      <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <div class="hlist">${list.map(h => habitRow(h, d, h.id === nextId)).join("") || `<p class="empty">Tap Edit to add a habit here.</p>`}</div>
      ${fit.url && list.some(h => h.fitness) ? `<a class="applink" href="${esc(fit.url)}" target="_blank" rel="noopener">Open ${esc(fit.name || "fitness app")} for today's workout ↗</a>` : ""}
      ${state.editing ? editorBlock(s, list, fit) : ""}
      ${logBlock(s)}
    </section>`;
  }

  function editorBlock(s, list, fit) {
    return `<div class="editor">
      <h3>${SLOT_LABEL[s]} habits</h3>
      ${list.map(h => `<div class="edit-row"><span>${esc(h.name)}</span><button class="linkbtn danger" data-remove-habit="${esc(h.id)}">Remove</button></div>`).join("")}
      <form class="addrow" id="addHabitForm"><input class="field" id="newHabit" placeholder="Add a ${SLOT_LABEL[s].toLowerCase()} habit" maxlength="40"><button class="btn" type="submit">Add</button></form>
      ${list.some(h => h.fitness) ? `<h3>Workout app link</h3>
      <form class="addrow" id="fitForm"><input class="field" id="fitName" placeholder="App name" maxlength="40" value="${esc(fit.name || "")}"><input class="field" id="fitUrl" type="url" placeholder="https://…" value="${esc(fit.url || "")}"><button class="btn ghost" type="submit">Save link</button></form>` : ""}
      ${list.some(hasRoutine) ? `<p class="note">Open Skincare's product list above to add, reorder, or remove products.</p>` : ""}
    </div>`;
  }

  function renderToday() { renderDayNav(); renderSegs(); renderPanel(); }

  // ---------- TRENDS ----------
  const METRICS = {
    sleep: { label: "Sleep", unit: "h", min: 0 },
    mood: { label: "Mood", unit: "", min: 1, max: 5 },
    energy: { label: "Energy", unit: "", min: 1, max: 5 },
    steps: { label: "Steps", unit: "", min: 0 },
    workout: { label: "Workout", unit: " min", min: 0 },
    weight: { label: "Weight", unit: "", min: null },
    habits: { label: "Habits %", unit: "%", min: 0, max: 100 }
  };
  const metricVal = (k, m) => {
    const d = state.days[k]; if (!d) return null;
    if (m === "habits") { const hs = state.config.habits; return hs.length && d.updated ? Math.round(hs.filter(h => d.habits[h.id]).length / hs.length * 100) : null; }
    return isNum(d[m]) ? d[m] : null;
  };

  function renderTrends() {
    $("#metricChips").innerHTML = Object.entries(METRICS).map(([k, m]) => `<button class="chip" data-metric-chip="${k}" aria-pressed="${state.metric === k}">${m.label}</button>`).join("");
    const keys = lastN(30), m = METRICS[state.metric];
    const pts = keys.map((k, i) => ({ i, k, v: metricVal(k, state.metric) })).filter(p => p.v !== null);
    const vals = pts.map(p => p.v);
    $("#trendSummary").textContent = vals.length ? `avg ${(+avg(vals).toFixed(1))}${m.unit} · ${vals.length} days logged` : "";
    if (vals.length < 2) { $("#chartBox").innerHTML = `<p class="empty">Log ${state.metric === "habits" ? "habits" : m.label.toLowerCase()} on at least two days and your trend line shows up here.</p>`; }
    else {
      const W = 640, H = 200, L = 36, R = 14, T = 12, B = 26;
      let lo = m.min ?? Math.min(...vals), hi = m.max ?? Math.max(...vals);
      if (m.min === null) { const padv = (hi - lo) * 0.15 || 1; lo = Math.floor(lo - padv); hi = Math.ceil(hi + padv); }
      if (m.max === undefined && m.min !== null) hi = Math.max(hi, Math.ceil(Math.max(...vals) * 1.1) || 1);
      const x = i => L + i * (W - L - R) / 29, y = v => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
      const ticks = [lo, lo + (hi - lo) / 2, hi].map(v => Math.round(v * 10) / 10);
      const line = pts.map((p, j) => `${j ? "L" : "M"}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
      const area = `${line}L${x(pts.at(-1).i).toFixed(1)},${y(lo)}L${x(pts[0].i).toFixed(1)},${y(lo)}Z`;
      const last = pts.at(-1);
      $("#chartBox").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.label} over the last 30 days">
        ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("")}
        <path d="${area}" fill="var(--accent)" fill-opacity="0.12" stroke="none"/>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map(p => `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="2.5" fill="var(--accent)"/>`).join("")}
        <circle cx="${x(last.i)}" cy="${y(last.v)}" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
        <text x="${L}" y="${H - 6}">${fmt(keys[0], { month: "short", day: "numeric" })}</text>
        <text x="${W - R}" y="${H - 6}" text-anchor="end">${fmt(keys[29], { month: "short", day: "numeric" })}</text>
      </svg>`;
    }
    const hk = lastN(28), t = todayKey(), hs = state.config.habits;
    $("#heatBox").innerHTML = hs.length ? `<table class="heat"><tbody>${hs.map(h => `<tr class="${slotOf(h)}"><th>${esc(hname(h))} <span class="pill ${slotOf(h)}">${streak(h.id)}d</span></th>${hk.map(k => `<td class="${day(k).habits[h.id] ? "on" : ""} ${k === t ? "today" : ""}" title="${esc(hname(h))} · ${fmt(k, { month: "short", day: "numeric" })}"></td>`).join("")}</tr>`).join("")}</tbody></table>` : `<p class="empty">Add habits on the Today tab to fill this grid.</p>`;
  }

  // ---------- WEEK ----------
  function weekData() {
    const keys = lastN(7), hs = state.config.habits;
    const logged = keys.filter(k => state.days[k]?.updated);
    const habitPct = hs.length && logged.length ? Math.round(logged.reduce((s, k) => s + hs.filter(h => day(k).habits[h.id]).length, 0) / (hs.length * 7) * 100) : null;
    const nums = f => keys.map(k => day(k)[f]).filter(isNum);
    return { keys, logged, habitPct, steps: avg(nums("steps")), sleep: avg(nums("sleep")), mood: avg(nums("mood")), energy: avg(nums("energy")), workout: nums("workout").reduce((s, x) => s + x, 0) };
  }
  function renderWeek() {
    const w = weekData(), f1 = v => v === null ? "–" : v.toFixed(1);
    $("#weekRange").textContent = `${fmt(w.keys[0], { month: "short", day: "numeric" })} – ${fmt(w.keys[6], { month: "short", day: "numeric" })}`;
    $("#weekStats").innerHTML = [
      [`${w.logged.length}/7`, "Days checked in"],
      [w.habitPct === null ? "–" : w.habitPct + "%", "Habits done"],
      [w.steps === null ? "–" : Math.round(w.steps).toLocaleString(), "Avg steps"],
      [f1(w.sleep), "Avg hours slept"],
      [f1(w.mood), "Avg mood"],
      [f1(w.energy), "Avg energy"],
      [w.workout || "0", "Workout minutes"]
    ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
    $("#weekRows").innerHTML = w.keys.slice().reverse().map(k => {
      const d = state.days[k], label = fmt(k, { weekday: "short", day: "numeric" });
      if (!d?.updated) return `<div class="weekrow"><div class="d">${label}</div><div class="empty">No check-in</div></div>`;
      return `<div class="weekrow"><div class="d">${label}</div><div>
        ${SLOTS.map(([s, l]) => slotHabits(s).length ? `<span class="pill ${s} num">${l} ${slotDone(s, k)}/${slotHabits(s).length}</span>` : "").join("")}
        ${isNum(d.mood) ? `<span class="pill num">mood ${d.mood}</span>` : ""}${isNum(d.sleep) ? `<span class="pill num">${d.sleep}h sleep</span>` : ""}</div></div>`;
    }).join("");
  }

  // ---------- tabs ----------
  function showTab(t) {
    if (!["today", "trends", "week"].includes(t)) t = "today";
    state.tab = t;
    $$(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    ["today", "trends", "week"].forEach(x => { $("#tab-" + x).hidden = x !== t; });
    try { localStorage.setItem("dc:tab", t); } catch {}
    renderDayNav();
    ({ today: renderToday, trends: renderTrends, week: renderWeek })[t]();
  }

  // ---------- events ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("button"); if (!el) return;
    if (el.dataset.tab) return showTab(el.dataset.tab);
    if (el.dataset.seg) { state.slot = el.dataset.seg; return renderToday(); }
    if (el.dataset.expand) { const id = el.dataset.expand; state.openRoutines.has(id) ? state.openRoutines.delete(id) : state.openRoutines.add(id); return renderPanel(); }
    if (el.dataset.habit) { const d = touchDay(state.cur); d.habits[el.dataset.habit] = !d.habits[el.dataset.habit]; commitDay(state.cur); state.pop = el.dataset.habit; renderSegs(); renderPanel(); state.pop = null; return; }
    if (el.dataset.scale) { const d = touchDay(state.cur), f = el.dataset.scale, v = +el.dataset.val; d[f] = d[f] === v ? null : v; commitDay(state.cur); return renderPanel(); }
    if (el.dataset.rstepUp || el.dataset.rstepDel) {
      const [hid, i] = (el.dataset.rstepUp || el.dataset.rstepDel).split(":"), h = state.config.habits.find(x => x.id === hid), n = +i;
      const steps = stepsOf(h, state.cur);
      if (el.dataset.rstepUp) [steps[n - 1], steps[n]] = [steps[n], steps[n - 1]]; else steps.splice(n, 1);
      store.saveConfig(state.config); return renderPanel();
    }
    if (el.dataset.removeHabit) { state.config.habits = state.config.habits.filter(h => h.id !== el.dataset.removeHabit); store.saveConfig(state.config); return renderToday(); }
    if (el.dataset.metricChip) { state.metric = el.dataset.metricChip; return renderTrends(); }
    switch (el.id) {
      case "prevDay": state.cur = shift(state.cur, -1); return renderToday();
      case "nextDay": if (state.cur < todayKey()) state.cur = shift(state.cur, 1); return renderToday();
      case "editBtn": state.editing = !state.editing; return renderPanel();
      case "exportBtn": return exportBackup();
    }
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.id === "importFile") { if (el.files[0]) importBackup(el.files[0]); el.value = ""; return; }
    if (el.dataset.prod) {
      const [hid, i] = el.dataset.prod.split(":"), h = state.config.habits.find(x => x.id === hid), steps = stepsOf(h, state.cur), name = steps[+i];
      const d = touchDay(state.cur); d.products = d.products || {};
      const set = new Set(d.products[hid] || []); el.checked ? set.add(name) : set.delete(name);
      d.products[hid] = [...set];
      if (steps.every(s => set.has(s))) d.habits[hid] = true;
      commitDay(state.cur); renderSegs(); return renderPanel();
    }
    // Hitting the step goal checks off the steps habit once the number is entered.
    if (el.id === "m-steps") { const d = touchDay(state.cur); if (isNum(d.steps) && d.steps >= STEP_GOAL && !d.habits.steps) { d.habits.steps = true; commitDay(state.cur); } renderSegs(); return renderPanel(); }
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset.metric) { const d = touchDay(state.cur), v = el.value === "" ? null : parseFloat(el.value); d[el.dataset.metric] = isNum(v) ? v : null; commitDay(state.cur); }
  });
  document.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    if (f.id === "addHabitForm") { const v = $("#newHabit").value.trim(); if (!v) return; state.config.habits.push({ id: "h-" + uid(), name: v, slot: state.slot }); store.saveConfig(state.config); renderToday(); return $("#newHabit")?.focus(); }
    if (f.id === "fitForm") { const url = $("#fitUrl").value.trim(); if (url && !/^https:\/\//i.test(url)) { $("#fitUrl").setCustomValidity("Use a link that starts with https://"); return $("#fitUrl").reportValidity(); } state.config.fitness = { name: $("#fitName").value.trim(), url }; store.saveConfig(state.config); return renderPanel(); }
    if (f.dataset.addRstep) { const id = f.dataset.addRstep, v = f.querySelector("input").value.trim(); if (!v) return; stepsOf(state.config.habits.find(h => h.id === id), state.cur).push(v); store.saveConfig(state.config); renderPanel(); return $("#rstep-" + id)?.focus(); }
  });
  // <details> toggle doesn't bubble, so listen in the capture phase to remember which routines are open.
  document.addEventListener("toggle", e => {
    const id = e.target.dataset?.routine; if (!id) return;
    e.target.open ? state.openRoutines.add(id) : state.openRoutines.delete(id);
  }, true);

  // ---------- boot ----------
  const hr = new Date().getHours();
  $("#greeting").textContent = `${hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening"} · ${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}`;
  let startTab = "today"; try { startTab = localStorage.getItem("dc:tab") || "today"; } catch {}
  // The restore button is a <label>; let Enter/Space open the file picker like a real button.
  $("label[for=importFile]").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#importFile").click(); } });
  showTab(startTab);
  (() => {
    const { config, days } = store.load();
    // v2 replaced the starter habits with the personal Morning / Daytime / Evening set; v3 filled in the skincare routines.
    const v = config.v || 1;
    if (v < 2) { config.habits = structuredClone(DEFAULT_CONFIG.habits); config.fitness = { ...DEFAULT_CONFIG.fitness }; }
    // v3 filled in the skincare routines (only lists edited from v3 on are kept);
    // v4 moved reading and 10k steps to the evening and split Walk Leo into morning and evening; keeps edited skincare lists and custom habits.
    else if (v < 4) {
      const mine = Object.fromEntries(config.habits.map(h => [h.id, h]));
      config.habits = [
        ...DEFAULT_CONFIG.habits.map(h => (h.id === "am-skin" || h.id === "pm-skin") && mine[h.id] && v >= 3 ? mine[h.id] : structuredClone(h)),
        ...config.habits.filter(h => h.id.startsWith("h-"))
      ];
    }
    if (v < CONFIG_VERSION) { config.v = CONFIG_VERSION; store.saveConfig(config); }
    state.config = config; state.days = days;
    setSaved(true);
    showTab(state.tab);
  })();
  // Works offline once installed; ask the browser not to clear our data when space runs low.
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.storage?.persist?.().catch(() => {});
})();
</script>
